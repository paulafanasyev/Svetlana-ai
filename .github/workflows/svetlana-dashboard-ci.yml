name: Svetlana Dashboard CI

on:
  pull_request:
    branches:
      - svetlana-pilot
    paths:
      - "dashboard/**"
      - ".github/workflows/svetlana-dashboard-ci.yml"

permissions:
  contents: read

jobs:
  dashboard:
    name: Dashboard lint, tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci
        working-directory: dashboard

      - name: Lint dashboard
        run: npm run lint
        working-directory: dashboard

      - name: Run dashboard unit tests
        run: npm test
        working-directory: dashboard

      - name: Build dashboard
        run: npm run build
        working-directory: dashboard
